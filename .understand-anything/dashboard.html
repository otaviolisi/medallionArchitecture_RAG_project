<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bússola Pública — Knowledge Graph</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --text: #e2e8f0;
    --muted: #8892aa;
    --accent: #6c8efb;

    /* Layer colors */
    --api: #f59e42;
    --service: #6c8efb;
    --data: #34d399;
    --utility: #a78bfa;
    --unknown: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 700; color: #fff; }
  header span { font-size: 12px; color: var(--muted); }

  .search-box {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    color: var(--text);
    font-size: 13px;
    width: 220px;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }

  .layer-legend { display: flex; gap: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ── Tabs ── */
  .tabs {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0;
    flex-shrink: 0;
  }
  .tab {
    padding: 9px 20px;
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    user-select: none;
    transition: color 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── Main layout ── */
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Graph panel ── */
  #graph-panel {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #canvas {
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  #canvas:active { cursor: grabbing; }

  /* ── Sidebar ── */
  #sidebar {
    width: 340px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .node-detail { padding: 16px; }
  .node-detail h2 { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .node-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 10px;
    text-transform: capitalize;
  }

  .node-summary {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 14px;
  }

  .detail-section { margin-top: 12px; }
  .detail-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .detail-path {
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 11px;
    color: var(--accent);
    background: var(--surface2);
    padding: 6px 10px;
    border-radius: 4px;
    word-break: break-all;
  }

  .relations-list { list-style: none; }
  .relations-list li {
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .relations-list li:last-child { border-bottom: none; }
  .rel-name { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rel-type { font-size: 10px; color: var(--muted); background: var(--surface2); padding: 2px 6px; border-radius: 3px; flex-shrink: 0; }
  .rel-link { color: var(--accent); cursor: pointer; font-size: 11px; flex-shrink: 0; }
  .rel-link:hover { text-decoration: underline; }

  /* placeholder */
  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 24px;
  }

  /* ── Tour panel ── */
  #tour-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  #tour-panel.active { display: flex; }

  .tour-list { padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
  .tour-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .tour-card:hover { border-color: var(--accent); }
  .tour-card.active { border-color: var(--accent); background: #1e2540; }
  .tour-card h3 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .tour-card p { font-size: 12px; color: var(--muted); line-height: 1.5; }

  .tour-steps { padding: 12px; overflow-y: auto; flex: 1; }
  .tour-step {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
    border-radius: 4px;
  }
  .tour-step:hover { background: var(--surface2); padding-left: 8px; }
  .tour-step:last-child { border-bottom: none; }
  .step-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-info h4 { font-size: 13px; font-weight: 600; color: var(--text); }
  .step-info p { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.5; }

  /* ── Graph canvas helpers ── */
  .graph-tooltip {
    position: absolute;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text);
    pointer-events: none;
    z-index: 100;
    max-width: 240px;
    line-height: 1.5;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  /* ── Stats ── */
  .stats-bar {
    display: flex;
    gap: 20px;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .stat-item strong { color: var(--text); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🧭 Bússola Pública</h1>
    <span>Legislative Intelligence Pipeline — Knowledge Graph</span>
  </div>
  <div class="layer-legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--api)"></div>API</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--service)"></div>Service</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--data)"></div>Data</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--utility)"></div>Utility</div>
  </div>
  <input class="search-box" id="search" placeholder="Search files…" />
</header>

<div class="tabs">
  <div class="tab active" data-tab="graph">Graph View</div>
  <div class="tab" data-tab="tours">Guided Tours</div>
  <div class="tab" data-tab="list">All Files</div>
</div>

<div class="stats-bar">
  <div class="stat-item"><strong id="node-count">0</strong> files</div>
  <div class="stat-item"><strong id="edge-count">0</strong> connections</div>
  <div class="stat-item">Scroll to zoom · Drag to pan · Click to inspect</div>
</div>

<div class="workspace">

  <!-- Graph view -->
  <div id="graph-panel">
    <canvas id="canvas"></canvas>
    <div class="graph-tooltip" id="tooltip" style="display:none"></div>
  </div>

  <!-- Tour panel -->
  <div id="tour-panel">
    <div class="tour-list" id="tour-list"></div>
    <div class="tour-steps" id="tour-steps" style="display:none;border-top:1px solid var(--border)"></div>
  </div>

  <!-- All files list (hidden by default) -->
  <div id="list-panel" style="display:none;flex:1;overflow-y:auto;padding:12px;background:var(--bg)">
    <div id="file-list"></div>
  </div>

  <!-- Sidebar (node inspector) -->
  <div id="sidebar">
    <div class="sidebar-header">Node Inspector</div>
    <div class="empty-state" id="empty-state">
      Click any node in the graph<br>to inspect it here
    </div>
    <div class="node-detail" id="node-detail" style="display:none"></div>
  </div>

</div>

// ─── Layer colors ────────────────────────────────────────────────────────────
const LAYER_COLOR = {
  api:     '#f59e42',
  service: '#6c8efb',
  data:    '#34d399',
  utility: '#a78bfa',
  unknown: '#64748b',
};

// ─── State ───────────────────────────────────────────────────────────────────
let transform = { x: 0, y: 0, scale: 1 };
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let selectedNode = null;
let hoveredNode = null;
let nodePositions = {};
let searchQuery = '';

// ─── Layout ───────────────────────────────────────────────────────────────────
function computeLayout() {
  const layerOrder = ['utility', 'service', 'data', 'api'];
  const layerGroups = { utility: [], service: [], data: [], api: [] };

  GRAPH_DATA.nodes.forEach(n => {
    (layerGroups[n.layer] || layerGroups['utility']).push(n);
  });

  // Pipeline stages for data layer (left to right flow)
  const bronzeFiles = GRAPH_DATA.nodes.filter(n => n.filePath.includes('bronze/') && !n.filePath.includes('_'));
  const bronzeShared = GRAPH_DATA.nodes.filter(n => n.filePath.includes('bronze/_') );
  const silverFiles = GRAPH_DATA.nodes.filter(n => n.filePath.includes('silver/') && !n.filePath.includes('_'));
  const silverDb = GRAPH_DATA.nodes.filter(n => n.filePath.includes('silver/_'));
  const goldFiles = GRAPH_DATA.nodes.filter(n => n.filePath.includes('gold/'));
  const aiFiles = GRAPH_DATA.nodes.filter(n => n.filePath.includes('/AI/'));
  const utilityCore = GRAPH_DATA.nodes.filter(n => n.layer === 'utility' && !n.filePath.includes('scripts/'));
  const scriptFiles = GRAPH_DATA.nodes.filter(n => n.filePath.includes('scripts/'));
  const apiFiles = GRAPH_DATA.nodes.filter(n => n.layer === 'api');

  const W = 1600, H = 1000;
  const cols = [160, 360, 560, 760, 960, 1160, 1360];

  function place(nodes, cx, startY, gap) {
    nodes.forEach((n, i) => {
      nodePositions[n.id] = { x: cx, y: startY + i * gap };
    });
  }

  // Col 0: scripts
  place(scriptFiles, cols[0], 60, 60);

  // Col 1: utility core
  place(utilityCore, cols[1], 120, 80);

  // Col 2: bronze shared + bronze extractors
  place(bronzeShared, cols[2], 60, 70);
  place(bronzeFiles, cols[2], 280, 80);

  // Col 3: silver
  place(silverDb, cols[3], 100, 70);
  place(silverFiles, cols[3], 220, 80);

  // Col 4: gold
  place(goldFiles, cols[4], 150, 90);

  // Col 5: AI
  place(aiFiles, cols[5], 250, 110);

  // Col 6: API
  place(apiFiles, cols[6], 180, 90);
}

// ─── Canvas rendering ────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = canvas.offsetWidth * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  draw();
}

function worldToScreen(wx, wy) {
  return {
    x: wx * transform.scale + transform.x,
    y: wy * transform.scale + transform.y,
  };
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - transform.x) / transform.scale,
    y: (sy - transform.y) / transform.scale,
  };
}

const NODE_W = 130, NODE_H = 36, NODE_R = 6;

function nodeRect(pos) {
  return { x: pos.x - NODE_W/2, y: pos.y - NODE_H/2, w: NODE_W, h: NODE_H };
}

function isNodeVisible(node) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return node.name.toLowerCase().includes(q) ||
         node.filePath.toLowerCase().includes(q) ||
         node.summary.toLowerCase().includes(q) ||
         node.layer.toLowerCase().includes(q);
}

function drawRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function draw() {
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  ctx.clearRect(0, 0, W, H);

  // Background grid
  ctx.save();
  ctx.strokeStyle = '#1e2235';
  ctx.lineWidth = 0.5;
  const gridSize = 40 * transform.scale;
  const offsetX = transform.x % gridSize;
  const offsetY = transform.y % gridSize;
  for (let x = offsetX; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = offsetY; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();

  // Edges
  GRAPH_DATA.edges.forEach(edge => {
    const srcPos = nodePositions[edge.source];
    const tgtPos = nodePositions[edge.target];
    if (!srcPos || !tgtPos) return;

    const srcNode = GRAPH_DATA.nodes.find(n => n.id === edge.source);
    const tgtNode = GRAPH_DATA.nodes.find(n => n.id === edge.target);
    const srcVisible = isNodeVisible(srcNode);
    const tgtVisible = isNodeVisible(tgtNode);
    if (!srcVisible && !tgtVisible) return;

    const src = worldToScreen(srcPos.x, srcPos.y);
    const tgt = worldToScreen(tgtPos.x, tgtPos.y);

    ctx.save();
    ctx.beginPath();

    const isHighlighted = selectedNode &&
      (edge.source === selectedNode.id || edge.target === selectedNode.id);

    const cp1x = src.x + (tgt.x - src.x) * 0.5;
    const cp1y = src.y;
    const cp2x = src.x + (tgt.x - src.x) * 0.5;
    const cp2y = tgt.y;

    ctx.moveTo(src.x, src.y);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, tgt.x, tgt.y);

    if (isHighlighted) {
      const color = LAYER_COLOR[srcNode.layer] || '#64748b';
      ctx.strokeStyle = color + 'cc';
      ctx.lineWidth = 2;
    } else {
      ctx.strokeStyle = '#2e3350' + ((!srcVisible || !tgtVisible) ? '33' : '99');
      ctx.lineWidth = 1;
    }
    ctx.stroke();

    // Arrow head on highlighted edges
    if (isHighlighted) {
      const dx = tgt.x - cp2x, dy = tgt.y - cp2y;
      const angle = Math.atan2(dy, dx);
      const ax = tgt.x - 12 * Math.cos(angle);
      const ay = tgt.y - 12 * Math.sin(angle);
      ctx.beginPath();
      ctx.moveTo(tgt.x, tgt.y);
      ctx.lineTo(ax - 6 * Math.sin(angle), ay + 6 * Math.cos(angle));
      ctx.lineTo(ax + 6 * Math.sin(angle), ay - 6 * Math.cos(angle));
      ctx.closePath();
      ctx.fillStyle = LAYER_COLOR[srcNode.layer] || '#64748b';
      ctx.fill();
    }
    ctx.restore();
  });

  // Nodes
  GRAPH_DATA.nodes.forEach(node => {
    const pos = nodePositions[node.id];
    if (!pos) return;

    const sp = worldToScreen(pos.x, pos.y);
    const { x, y, w, h } = nodeRect({ x: sp.x, y: sp.y });
    const color = LAYER_COLOR[node.layer] || LAYER_COLOR.unknown;
    const isSelected = selectedNode && selectedNode.id === node.id;
    const isHovered = hoveredNode && hoveredNode.id === node.id;
    const visible = isNodeVisible(node);

    ctx.save();
    ctx.globalAlpha = visible ? 1 : 0.2;

    // Shadow on selected
    if (isSelected) {
      ctx.shadowBlur = 20;
      ctx.shadowColor = color;
    }

    // Fill
    drawRoundRect(ctx, x, y, w, h, NODE_R);
    ctx.fillStyle = isSelected ? color + '33' : (isHovered ? '#1e2540' : '#1a1d27');
    ctx.fill();

    // Border
    drawRoundRect(ctx, x, y, w, h, NODE_R);
    ctx.strokeStyle = isSelected ? color : (isHovered ? color + '99' : '#2e3350');
    ctx.lineWidth = isSelected ? 2 : 1;
    ctx.stroke();

    // Color stripe
    ctx.fillStyle = color;
    ctx.fillRect(x, y + h - 3, w, 3);
    ctx.beginPath();
    ctx.moveTo(x, y + h - 3);
    ctx.lineTo(x + NODE_R, y + h);
    ctx.lineTo(x + w - NODE_R, y + h);
    ctx.lineTo(x + w, y + h - 3);
    ctx.fill();

    ctx.restore();

    // Label
    ctx.save();
    ctx.globalAlpha = visible ? 1 : 0.2;
    ctx.font = `${isSelected ? 600 : 400} ${Math.max(9, 11 * transform.scale)}px 'Segoe UI', system-ui`;
    ctx.fillStyle = isSelected ? '#fff' : (isHovered ? '#e2e8f0' : '#94a3b8');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const label = node.name.length > 18 ? node.name.slice(0, 16) + '…' : node.name;
    ctx.fillText(label, sp.x, sp.y);
    ctx.restore();
  });
}

// ─── Interaction ─────────────────────────────────────────────────────────────
function getNodeAt(sx, sy) {
  const wp = screenToWorld(sx, sy);
  for (const node of GRAPH_DATA.nodes) {
    const pos = nodePositions[node.id];
    if (!pos) continue;
    if (Math.abs(wp.x - pos.x) < NODE_W / 2 && Math.abs(wp.y - pos.y) < NODE_H / 2) {
      return node;
    }
  }
  return null;
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const delta = e.deltaY < 0 ? 1.1 : 0.9;
  transform.x = mx - (mx - transform.x) * delta;
  transform.y = my - (my - transform.y) * delta;
  transform.scale = Math.max(0.2, Math.min(3, transform.scale * delta));
  draw();
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  if (isDragging) {
    transform.x = e.clientX - dragStart.x;
    transform.y = e.clientY - dragStart.y;
    draw();
    return;
  }

  const node = getNodeAt(sx, sy);
  if (node !== hoveredNode) {
    hoveredNode = node;
    draw();
    if (node) {
      const tooltip = document.getElementById('tooltip');
      tooltip.style.display = 'block';
      tooltip.style.left = (sx + 12) + 'px';
      tooltip.style.top = (sy - 10) + 'px';
      tooltip.innerHTML = `<strong>${node.name}</strong><br><span style="color:var(--muted)">${node.layer}</span><br><small>${node.summary.slice(0, 100)}…</small>`;
    } else {
      document.getElementById('tooltip').style.display = 'none';
    }
  }
});

canvas.addEventListener('mouseup', e => {
  if (!isDragging) return;
  const rect = canvas.getBoundingClientRect();
  const moved = Math.abs(e.clientX - rect.left + transform.x - dragStart.x - transform.x) > 3;
  isDragging = false;
  if (!moved) {
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    const node = getNodeAt(sx, sy);
    if (node) selectNode(node);
  }
});
canvas.addEventListener('mouseleave', () => { isDragging = false; });

function selectNode(node) {
  selectedNode = node;
  document.getElementById('empty-state').style.display = 'none';
  const detail = document.getElementById('node-detail');
  detail.style.display = 'block';

  const color = LAYER_COLOR[node.layer] || LAYER_COLOR.unknown;

  // Find connections
  const outgoing = GRAPH_DATA.edges
    .filter(e => e.source === node.id)
    .map(e => ({ ...GRAPH_DATA.nodes.find(n => n.id === e.target), edgeType: e.type, dir: 'out' }))
    .filter(Boolean);
  const incoming = GRAPH_DATA.edges
    .filter(e => e.target === node.id)
    .map(e => ({ ...GRAPH_DATA.nodes.find(n => n.id === e.source), edgeType: e.type, dir: 'in' }))
    .filter(Boolean);

  const relItems = (list, dir) => list.map(rel => {
    const arrow = dir === 'out' ? '→' : '←';
    return `<li>
      <span class="rel-name">${rel.name}</span>
      <span class="rel-type">${arrow} ${rel.edgeType}</span>
      <span class="rel-link" onclick="selectNodeById('${rel.id}')">go</span>
    </li>`;
  }).join('');

  detail.innerHTML = `
    <h2>${node.name}</h2>
    <span class="node-badge" style="background:${color}22;color:${color}">${node.layer} · ${node.language}</span>
    <p class="node-summary">${node.summary}</p>
    <div class="detail-section">
      <div class="detail-label">File path</div>
      <div class="detail-path">${node.filePath}</div>
    </div>
    ${outgoing.length ? `<div class="detail-section">
      <div class="detail-label">Depends on (${outgoing.length})</div>
      <ul class="relations-list">${relItems(outgoing, 'out')}</ul>
    </div>` : ''}
    ${incoming.length ? `<div class="detail-section">
      <div class="detail-label">Used by (${incoming.length})</div>
      <ul class="relations-list">${relItems(incoming, 'in')}</ul>
    </div>` : ''}
  `;

  draw();
  centerOnNode(node);
}

function selectNodeById(id) {
  const node = GRAPH_DATA.nodes.find(n => n.id === id);
  if (node) selectNode(node);
}
window.selectNodeById = selectNodeById;

function centerOnNode(node) {
  const pos = nodePositions[node.id];
  if (!pos) return;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  transform.x = W / 2 - pos.x * transform.scale;
  transform.y = H / 2 - pos.y * transform.scale;
  draw();
}

function renderTours() {
  const list = document.getElementById('tour-list');
  list.innerHTML = GRAPH_DATA.tours.map(tour => `
    <div class="tour-card" data-tour="${tour.id}" onclick="selectTour('${tour.id}')">
      <h3>${tour.name}</h3>
      <p>${tour.description}</p>
    </div>
  `).join('');
}

function selectTour(id) {
  const tour = GRAPH_DATA.tours.find(t => t.id === id);
  if (!tour) return;

  document.querySelectorAll('.tour-card').forEach(c => c.classList.toggle('active', c.dataset.tour === id));

  const stepsEl = document.getElementById('tour-steps');
  stepsEl.style.display = 'block';
  stepsEl.innerHTML = `<div class="sidebar-header">${tour.name}</div>` +
    tour.steps.map((step, i) => {
      const node = GRAPH_DATA.nodes.find(n => n.id === step.nodeId);
      if (!node) return '';
      const color = LAYER_COLOR[node.layer] || LAYER_COLOR.unknown;
      return `
        <div class="tour-step" onclick="goToGraphNode('${step.nodeId}')">
          <div class="step-num" style="background:${color}">${i + 1}</div>
          <div class="step-info">
            <h4>${node.name}</h4>
            <p>${step.reason}</p>
          </div>
        </div>
      `;
    }).join('');
}
window.selectTour = selectTour;

function goToGraphNode(id) {
  // Switch to graph tab
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'graph'));
  document.getElementById('graph-panel').style.display = 'block';
  document.getElementById('tour-panel').classList.remove('active');
  document.getElementById('list-panel').style.display = 'none';
  document.getElementById('sidebar').style.display = 'flex';

  const node = GRAPH_DATA.nodes.find(n => n.id === id);
  if (node) {
    resize();
    selectNode(node);
  }
}

  el.innerHTML = layers.map(layer => {

    const color = LAYER_COLOR[layer];
    return `
      <div style="margin-bottom:16px">
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:${color};margin-bottom:8px;padding:0 4px">

// ─── Stats ───────────────────────────────────────────────────────────────────
document.getElementById('node-count').textContent = GRAPH_DATA.nodes.length;
document.getElementById('edge-count').textContent = GRAPH_DATA.edges.length;

// ─── Init ────────────────────────────────────────────────────────────────────
computeLayout();

// Center the graph initially
window.addEventListener('load', () => {
  resize();
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  transform.x = W * 0.05;
  transform.y = H * 0.08;
  transform.scale = 0.75;
  draw();
});

window.addEventListener('resize', resize);
</script>
</body>
</html>
